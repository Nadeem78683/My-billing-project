<!DOCTYPE html>
<html>
<head>
<title>Nadeem Kirana Billing</title>
<style>
body{font-family:Arial; padding:20px;}
input{padding:8px; margin:5px;}
button{padding:10px 20px; background:green; color:white; border:none;}
</style>
</head>
<body>

<h2>Nadeem Kirana Store - Muradnagar</h2>

Rate: <input id="rate" type="number" value="180"><br>
Qty: <input id="qty" type="number" value="2"><br>

<button onclick="calc()">Total Nikalo</button>

<h1 id="ans" style="color:green;"></h1>

<script>
function calc(){
  let r = document.getElementById('rate').value;
  let q = document.getElementById('qty').value;
  let total = r * q;
  document.getElementById('ans').innerText = "Total = " + total + " Rs";
}
</script>

</body>
</html>
